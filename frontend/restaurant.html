<!DOCTYPE html>
<html>
<head>
  <title>Restaurant Panel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <div class="top-bar">
    <button onclick="logout()" class="btn danger">Logout</button>
  </div>

  <div class="card">
    <h2>Add Restaurant</h2>
    <input id="rName" placeholder="Restaurant Name">
    <button onclick="addRestaurant()" class="btn primary">Add Restaurant</button>
  </div>

  <div class="card">
    <h2>Add Meal</h2>
    <select id="restaurantSelect"></select>
    <input id="mealName" placeholder="Meal Name">
    <input id="mealPrice" placeholder="Price">
    <button onclick="addMeal()" class="btn primary">Add Meal</button>
  </div>

  <div class="card">
    <h2>My Restaurants</h2>
    <div id="myRestaurants"></div>
  </div>

</div>

<script src="app.js"></script>
<script>
  loadMyRestaurants();
</script>

</body>
</html>
